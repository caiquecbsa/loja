<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertinhas da Sam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero {
            width: 100%;
            height: 100%;
            background-image: url('imagem_2026-03-14_120801838.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f9e5f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-shopee {
            display: inline-block;
            background: #ee4d2d;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            text-decoration: none;
            padding: 1.2rem 4rem;
            border-radius: 70px;
            box-shadow: 0 10px 0 #a4331e, 0 15px 25px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            border: 3px solid #ffffff;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .btn-shopee:hover {
            background: #f05a3a;
            transform: translateY(5px);
            box-shadow: 0 5px 0 #a4331e, 0 15px 25px rgba(0,0,0,0.25);
        }

        .btn-shopee:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #a4331e, 0 15px 25px rgba(0,0,0,0.2);
        }

        @media (max-width: 600px) {
            .btn-shopee {
                font-size: 2rem;
                padding: 1rem 2.5rem;
                border-radius: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="hero" role="img" aria-label="Fundo Ofertinhas da Sam">
        <a href="https://s.shopee.com.br/5L7AxqCwFr" 
           class="btn-shopee" 
           target="_blank" 
           rel="noopener noreferrer">
           clique aqui
        </a>
    </div>
</body>
</html>
